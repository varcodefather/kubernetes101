apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-ingress
  namespace: cka-lab
spec:
  rules:
    - host: app.cka.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-http
                port:
                  number: 80
