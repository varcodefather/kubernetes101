apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: cka-lab
spec:
  containers:
  - name: writer
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - '3600'
    volumeMounts:
    - name: data
      mountPath: /data
  restartPolicy: Never
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: scratch-data
