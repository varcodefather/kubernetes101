apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: image101
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: local-web:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
