apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: troubleshooting101
spec:
  replicas: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:missing-demo-tag
          ports:
            - containerPort: 80
