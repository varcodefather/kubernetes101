apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: troubleshooting101
spec:
  replicas: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args: ["echo 'Demo startup error: missing config'; sleep 2; exit 1"]
