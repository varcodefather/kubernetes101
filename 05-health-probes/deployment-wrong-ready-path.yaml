apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-app
  namespace: probes101
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-app
  template:
    metadata:
      labels:
        app: health-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: health-web:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: STARTUP_SECONDS
              value: "20"
          readinessProbe:
            httpGet:
              path: /missing
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /startup
              port: http
            periodSeconds: 1
            failureThreshold: 40
