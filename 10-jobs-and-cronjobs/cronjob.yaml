apiVersion: batch/v1
kind: CronJob
metadata:
  name: minute-totals
  namespace: jobs101
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  suspend: true
  startingDeadlineSeconds: 30
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: totals
              image: totals-job:v1
              imagePullPolicy: Never
              env:
                - name: INPUT_VALUES
                  value: "12,18,30"
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
