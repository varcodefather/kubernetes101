apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: network101
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: web
          image: network-web:v1
          imagePullPolicy: Never
          env:
            - name: ROLE
              value: backend
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
